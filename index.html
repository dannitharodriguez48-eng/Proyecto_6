<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda Creativa | Calendario</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="datepicker">
    <div class="campo">
      <input type="text" placeholder="dd / mm / aaaa" aria-label="Fecha seleccionada">
      <button type="button" aria-label="Abrir calendario">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <rect x="3" y="5" width="18" height="16" rx="2"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
          <line x1="9" y1="10" x2="9" y2="21"/>
          <line x1="15" y1="10" x2="15" y2="21"/>
          <line x1="8" y1="2" x2="8" y2="7" stroke-width="3"/>
          <line x1="16" y1="2" x2="16" y2="7" stroke-width="3"/>
        </svg>
      </button>
    </div>

    <div class="calendario">
      <div class="mes">
        <span class="triangulo izq"></span>
        <span>Octubre 2026</span>
        <span class="triangulo der"></span>
      </div>

      <div class="semana">
        <span>D</span><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span>
      </div>

      <div class="dias">
        <div class="vacio"></div>
        <div class="vacio"></div>
        <div class="vacio"></div>
        <div class="vacio"></div>
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>
        <div>9</div>
        <div>10</div>
        <div>11</div>
        <div>12</div>
        <div>13</div>
        <div>14</div>
        <div>15</div>
        <div>16</div>
        <div>17</div>
        <div>18</div>
        <div>19</div>
        <div>20</div>
        <div>21</div>
        <div>22</div>
        <div>23</div>
        <div>24</div>
        <div>25</div>
        <div>26</div>
        <div>27</div>
        <div>28</div>
        <div>29</div>
        <div>30</div>
        <div>31</div>
      </div>
    </div>
  </div>

</body>
</html>
